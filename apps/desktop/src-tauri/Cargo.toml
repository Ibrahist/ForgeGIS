[package]
name = "forgegis-desktop"
version = "0.1.0"
description = "ForgeGIS - Local-first Cloud-native GIS Desktop Shell"
authors = ["ForgeGIS Core Team"]
edition = "2021"

[lib]
name = "forgegis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
