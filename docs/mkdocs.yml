site_name: ForgeGIS
site_description: Lightweight, local-first, cloud-native geospatial exploration platform
site_author: ForgeGIS Core Team
site_url: https://forgegis.org
repo_url: https://github.com/yourorg/ForgeGIS
repo_name: yourorg/ForgeGIS

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: amber
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Geoprocessing (17 WASM Tools): geoprocessing.md
  - Spatial SQL (DuckDB-WASM): spatial-sql.md
  - Modular Plugins: plugins.md
  - Python SDK & AnyWidget: python-sdk.md
  - Desktop Shell (Tauri v2): desktop.md
  - Project Specification (v1.0.0): project-spec.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
