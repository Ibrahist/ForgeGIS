[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgegis"
version = "0.1.0"
description = "Lightweight local-first cloud-native GIS in Python and Jupyter AnyWidget"
readme = "README.md"
authors = [{ name = "ForgeGIS Core Team", email = "core@forgegis.org" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "anywidget>=0.9.0",
    "traitlets>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
